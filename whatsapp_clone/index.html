<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Web Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #111b21;
            color: #e9edef;
            overflow: hidden;
        }

        .app {
            display: flex;
            height: 100vh;
            background: #111b21;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background: #202c33;
            margin: 5% auto;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            color: #e9edef;
            position: relative;
        }

        .close {
            position: absolute;
            right: 15px;
            top: 15px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            color: #8696a0;
            transition: color 0.2s;
        }

        .close:hover {
            color: #e9edef;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #e9edef;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #313b44;
            border-radius: 4px;
            background: #2a3942;
            color: #e9edef;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #00a884;
        }

        .btn {
            background: #00a884;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #017561;
        }

        .btn-secondary {
            background: #8696a0;
            margin-right: 10px;
        }

        .btn-secondary:hover {
            background: #667781;
        }

        /* Sidebar */
        .sidebar {
            width: 400px;
            background: #111b21;
            border-right: 1px solid #313b44;
            display: flex;
            flex-direction: column;
            transition: width 0.3s ease;
        }

        .sidebar-header {
            height: 59px;
            background: #202c33;
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid #313b44;
        }

        .profile-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #00a884;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 500;
            margin-right: auto;
            cursor: pointer;
        }

        .header-icons {
            display: flex;
            gap: 20px;
        }

        .header-icon {
            width: 24px;
            height: 24px;
            cursor: pointer;
            color: #aebac1;
            transition: color 0.2s;
        }

        .header-icon:hover {
            color: #e9edef;
        }

        .tab-container {
            display: flex;
            background: #202c33;
            border-bottom: 1px solid #313b44;
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            color: #8696a0;
            font-weight: 500;
            transition: all 0.2s;
            border-bottom: 2px solid transparent;
        }

        .tab.active {
            color: #00a884;
            border-bottom-color: #00a884;
        }

        .tab:hover {
            color: #e9edef;
            background: #2a3942;
        }

        .search-container {
            padding: 12px 16px;
            background: #111b21;
        }

        .search-wrapper {
            background: #202c33;
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 8px 12px;
        }

        .search-icon {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            color: #aebac1;
        }

        .search-input {
            flex: 1;
            background: none;
            border: none;
            color: #e9edef;
            font-size: 14px;
            outline: none;
        }

        .search-input::placeholder {
            color: #8696a0;
        }

        .filter-container {
            padding: 0 16px 8px;
            display: flex;
            gap: 8px;
        }

        .filter-btn {
            padding: 6px 12px;
            background: #202c33;
            border: none;
            border-radius: 16px;
            color: #8696a0;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: #005c4b;
            color: #e9edef;
        }

        .filter-btn:hover {
            background: #2a3942;
        }

        .contacts-list {
            flex: 1;
            overflow-y: auto;
            background: #111b21;
        }

        .contact-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid #313b44;
            transition: background 0.2s;
            position: relative;
        }

        .contact-item:hover {
            background: #202c33;
        }

        .contact-item.selected {
            background: #2a3942;
        }

        .contact-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #00a884;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 500;
            margin-right: 12px;
            flex-shrink: 0;
            position: relative;
        }

        .group-avatar {
            background: #667781;
        }

        .contact-info {
            flex: 1;
            min-width: 0;
        }

        .contact-name {
            font-size: 16px;
            color: #e9edef;
            margin-bottom: 2px;
            font-weight: 400;
        }

        .contact-status {
            font-size: 13px;
            color: #8696a0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contact-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            min-width: 0;
        }

        .contact-time {
            font-size: 12px;
            color: #8696a0;
            margin-bottom: 4px;
        }

        .unread-count {
            background: #00a884;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 500;
        }

        .online-indicator {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            background: #00a884;
            border: 2px solid #111b21;
            border-radius: 50%;
        }

        /* Main Chat Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0b141a;
        }

        .chat-header {
            height: 59px;
            background: #202c33;
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid #313b44;
        }

        .chat-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #00a884;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 500;
            margin-right: 12px;
        }

        .chat-info {
            flex: 1;
        }

        .chat-title {
            font-size: 16px;
            color: #e9edef;
            margin-bottom: 2px;
        }

        .chat-subtitle {
            font-size: 13px;
            color: #8696a0;
        }

        .chat-actions {
            display: flex;
            gap: 20px;
        }

        .chat-action {
            width: 24px;
            height: 24px;
            color: #aebac1;
            cursor: pointer;
            transition: color 0.2s;
        }

        .chat-action:hover {
            color: #e9edef;
        }

        .chat-area {
            flex: 1;
            background: #0b141a;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="pattern" patternUnits="userSpaceOnUse" width="80" height="80"><g fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1"><path d="M20 20h40v40H20z"/><path d="M40 40h40v40H40z"/></g></pattern></defs><rect width="100" height="100" fill="url(%23pattern)"/></svg>');
            position: relative;
            overflow-y: auto;
            padding: 20px;
        }

        .message-input-container {
            background: #202c33;
            padding: 10px 16px;
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }

        .message-input-wrapper {
            flex: 1;
            background: #2a3942;
            border-radius: 8px;
            display: flex;
            align-items: flex-end;
            padding: 8px 12px;
            min-height: 42px;
        }

        .message-input {
            flex: 1;
            background: none;
            border: none;
            color: #e9edef;
            font-size: 14px;
            outline: none;
            resize: none;
            min-height: 20px;
            max-height: 100px;
            line-height: 20px;
            overflow-y: auto;
        }

        .message-input::placeholder {
            color: #8696a0;
        }

        .input-actions {
            display: flex;
            gap: 8px;
            margin-left: 8px;
        }

        .input-action {
            width: 24px;
            height: 24px;
            color: #8696a0;
            cursor: pointer;
            transition: color 0.2s;
        }

        .input-action:hover {
            color: #e9edef;
        }

        .send-btn {
            width: 42px;
            height: 42px;
            background: #00a884;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background: #017561;
        }

        .send-btn:disabled {
            background: #8696a0;
            cursor: not-allowed;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #8696a0;
            text-align: center;
        }

        .empty-state-icon {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .success-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #00a884;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .success-toast.show {
            transform: translateX(0);
        }

        .scrollbar-hide {
            scrollbar-width: thin;
            scrollbar-color: #8696a0 #202c33;
        }

        .scrollbar-hide::-webkit-scrollbar {
            width: 6px;
        }

        .scrollbar-hide::-webkit-scrollbar-track {
            background: #202c33;
        }

        .scrollbar-hide::-webkit-scrollbar-thumb {
            background: #8696a0;
            border-radius: 3px;
        }

        .scrollbar-hide::-webkit-scrollbar-thumb:hover {
            background: #aebac1;
        }

        /* Message Bubbles */
        .message-container {
            display: flex;
            flex-direction: column;
            margin-bottom: 16px;
        }

        .message-bubble {
            max-width: 70%;
            padding: 6px 12px 8px;
            border-radius: 8px;
            position: relative;
            word-wrap: break-word;
        }

        .message-bubble.sent {
            background: #005c4b;
            margin-left: auto;
            border-bottom-right-radius: 2px;
        }

        .message-bubble.received {
            background: #202c33;
            margin-right: auto;
            border-bottom-left-radius: 2px;
        }

        .message-text {
            color: #e9edef;
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 4px;
        }

        .message-info {
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            gap: 4px;
        }

        .message-time {
            font-size: 11px;
            color: #8696a0;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .message-status {
            color: #53bdeb;
            font-size: 12px;
        }

        .sender-name {
            font-size: 12px;
            color: #00a884;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #8696a0;
            font-size: 13px;
            padding: 8px 16px;
        }

        .typing-dots {
            display: flex;
            gap: 2px;
        }

        .typing-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #8696a0;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }

        /* Context Menu */
        .context-menu {
            position: absolute;
            background: #202c33;
            border: 1px solid #313b44;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            min-width: 150px;
            display: none;
        }

        .context-menu-item {
            padding: 8px 12px;
            cursor: pointer;
            font-size: 14px;
            color: #e9edef;
            transition: background 0.2s;
        }

        .context-menu-item:hover {
            background: #2a3942;
        }

        .context-menu-item.danger {
            color: #f15c6d;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                position: absolute;
                left: 0;
                z-index: 100;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .main-content {
                width: 100%;
            }

            .modal-content {
                width: 95%;
                margin: 10% auto;
            }

            .message-bubble {
                max-width: 85%;
            }
        }

        /* Group member selection */
        .member-selection {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #313b44;
            border-radius: 4px;
            background: #2a3942;
            margin-top: 10px;
        }

        .member-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .member-item:hover {
            background: #313b44;
        }

        .member-item.selected {
            background: #005c4b;
        }

        .member-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #00a884;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 500;
            margin-right: 12px;
            font-size: 12px;
        }

        .member-info {
            flex: 1;
        }

        .member-name {
            font-size: 14px;
            color: #e9edef;
            margin-bottom: 2px;
        }

        .member-status {
            font-size: 12px;
            color: #8696a0;
        }

        .add-contact-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            background: #00a884;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            transition: all 0.2s;
            z-index: 100;
        }

        .add-contact-btn:hover {
            background: #017561;
            transform: scale(1.1);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Loading spinner */
        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #313b44;
            border-top: 2px solid #00a884;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .selected-members {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 10px;
        }

        .selected-member {
            background: #005c4b;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .remove-member {
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <!-- Header -->
            <div class="sidebar-header">
                <div class="profile-avatar" onclick="openProfileModal()">WA</div>
                <div class="header-icons">
                    <svg class="header-icon" viewBox="0 0 24 24" fill="currentColor" onclick="showStatusModal()">
                        <circle cx="12" cy="12" r="8"/><path d="M12 2v20M2 12h20"/>
                    </svg>
                    <svg class="header-icon" viewBox="0 0 24 24" fill="currentColor" onclick="openNewChatModal()">
                        <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/>
                    </svg>
                    <svg class="header-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
                    </svg>
                </div>
            </div>

            <!-- Tabs -->
            <div class="tab-container">
                <div class="tab active" onclick="switchTab('chats')">Chats</div>
                <div class="tab" onclick="switchTab('contacts')">Contacts</div>
                <div class="tab" onclick="switchTab('groups')">Groups</div>
            </div>

            <!-- Search -->
            <div class="search-container">
                <div class="search-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                    <input type="text" class="search-input" placeholder="Search chats" id="searchInput">
                </div>
            </div>

            <!-- Filter -->
            <div class="filter-container">
                <button class="filter-btn active" onclick="filterContacts('all')">All</button>
                <button class="filter-btn" onclick="filterContacts('unread')">Unread</button>
                <button class="filter-btn" onclick="filterContacts('favorites')">Favorites</button>
                <button class="filter-btn" onclick="filterContacts('online')">Online</button>
            </div>

            <!-- Tab Contents -->
            <div class="tab-content active" id="chats-tab">
                <div class="contacts-list scrollbar-hide" id="chatsList">
                    <!-- Chats will be populated here -->
                </div>
            </div>

            <div class="tab-content" id="contacts-tab">
                <div class="contacts-list scrollbar-hide" id="contactsList">
                    <!-- Contacts will be populated here -->
                </div>
            </div>

            <div class="tab-content" id="groups-tab">
                <div class="contacts-list scrollbar-hide" id="groupsList">
                    <!-- Groups will be populated here -->
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Chat Header -->
            <div class="chat-header">
                <div class="chat-avatar" id="chatAvatar">💬</div>
                <div class="chat-info">
                    <div class="chat-title" id="chatTitle">Select a chat</div>
                    <div class="chat-subtitle" id="chatSubtitle">Choose a conversation to start messaging</div>
                </div>
                <div class="chat-actions">
                    <svg class="chat-action" viewBox="0 0 24 24" fill="currentColor" onclick="searchInChat()">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                    <svg class="chat-action" viewBox="0 0 24 24" fill="currentColor" onclick="openChatMenu()">
                        <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
                    </svg>
                </div>
            </div>

            <!-- Chat Area -->
            <div class="chat-area scrollbar-hide" id="chatArea">
                <div class="empty-state" id="emptyState">
                    <svg class="empty-state-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/>
                    </svg>
                    <h3>WhatsApp Web</h3>
                    <p>Send and receive messages without keeping your phone online.</p>
                </div>
            </div>

            <!-- Message Input -->
            <div class="message-input-container">
                <div class="message-input-wrapper">
